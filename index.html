<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Buy low, sell high, build a crew and take over Vice Harbor. Don't get caught. Don't get killed.">
<title>Drug Wars | Kaotic Gaming</title>
<script>
  // On Kaotic Gaming the files live under /play/<game>/; opened on its own, they're next to this page.
  // Bump ASSET_V when the css/js change so browsers fetch the new copies.
  const ASSET_V = '20261023-9';
  const assetRoot = window.KG_BOOT ? `/play/${window.KG_BOOT.game}/` : './';
  window.DW_ROOT = assetRoot;
  document.write(`<link rel="stylesheet" href="${assetRoot}style.css?v=${ASSET_V}">`);
  for (const f of ['data.js', 'art.js', 'sim.js', 'ui.js']) document.write(`<script src="${assetRoot}${f}?v=${ASSET_V}" defer><\/script>`);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=Bungee&family=Bungee+Shade&display=swap">
</head>
<body>
<div id="app">

  <!-- title screen -->
  <section class="screen title-screen" id="titleScreen">
    <div class="title-art" id="titleArt"></div>
    <div class="title-shade"></div>
    <div class="title-content">
      <div class="logo-wrap">
        <div class="logo-top">VICE HARBOR · 1986</div>
        <h1 class="logo"><span>DRUG</span><span>WARS</span></h1>
        <div class="logo-sub">Buy low. Sell high. Stay alive.</div>
      </div>
      <div class="title-records" id="titleRecords"></div>
      <div class="title-buttons">
        <button class="btn neon big hidden" id="continueBtn" type="button">Continue</button>
        <button class="btn neon big" id="newBtn" type="button">New game</button>
        <div class="row">
          <button class="btn ghost" id="helpBtn" type="button">How to play</button>
          <button class="btn ghost hidden" id="homeBtn" type="button">&#9664; All games</button>
        </div>
      </div>
      <div class="title-foot" id="titleFoot"></div>
    </div>
  </section>

  <!-- the game -->
  <section class="screen game-screen hidden" id="gameScreen">
    <header class="hud">
      <div class="hud-top">
        <div class="hud-day"><span>Day</span><strong id="hDay">1</strong></div>
        <div class="hud-money">
          <div class="hm cash"><span>Cash</span><strong id="hCash">$0</strong></div>
          <div class="hm bank"><span>Bank</span><strong id="hBank">$0</strong></div>
          <div class="hm debt" id="hDebtBox"><span>Debt</span><strong id="hDebt">$0</strong></div>
        </div>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
      <div class="hud-bars">
        <div class="bar hp" title="Health"><i id="bHp"></i><span>HP <b id="tHp">100</b></span></div>
        <div class="bar heat" title="Heat: how hard the cops are looking for you"><i id="bHeat"></i><span>HEAT <b id="tHeat">0</b></span></div>
        <div class="bar rep" title="Street rep: unlocks districts, jobs, crew and businesses"><i id="bRep"></i><span>REP <b id="tRep">0</b></span></div>
      </div>
    </header>

    <div class="scene" id="scene">
      <div class="scene-art" id="sceneArt"></div>
      <div class="scene-shade"></div>
      <div class="scene-info">
        <div class="scene-name" id="sceneName"></div>
        <div class="scene-tag" id="sceneTag"></div>
        <div class="chips" id="sceneChips"></div>
      </div>
    </div>
    <div class="ticker" id="ticker"></div>

    <main class="panel" id="panel"></main>

    <nav class="tabs" id="tabs">
      <button type="button" data-tab="market" class="on"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 12h-13zM8 7a4 4 0 0 1 8 0"/></svg><span>Market</span></button>
      <button type="button" data-tab="travel"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Travel</span></button>
      <button type="button" data-tab="city"><svg viewBox="0 0 24 24"><path d="M3 21V9l5-3v15M8 21V4l8-2v19M16 21V10l5 2v9M2 21h20"/></svg><span>City</span></button>
      <button type="button" data-tab="crew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .2 5.5 2.4 5.5 5.8"/></svg><span>Crew</span></button>
      <button type="button" data-tab="jobs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg><span>Jobs</span></button>
      <button type="button" data-tab="empire"><svg viewBox="0 0 24 24"><path d="M3 18h18l-1.5-10-4.5 4-3-6-3 6-4.5-4z"/><path d="M4 21h16"/></svg><span>Empire</span></button>
    </nav>
  </section>

  <div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
  <div class="toasts" id="toasts"></div>
</div>
</body>
</html>
